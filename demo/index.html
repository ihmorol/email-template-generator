<script>
let titleTouched = false, batches = [], zoomOn = false, recsOn = false, kind = 'live', paste = { live: false, recorded: false }, recs = null, kit = null, timer, seq = 0;
let res = [], links = [], off = '', backDay = '', remPick = '', lastReason = '', lenFor = '';
let day = '', clock = '', stack = [], picked = '', detailName = '', detailEmails = [], editingName = '', lastCheck = { emails: [], skipped: [] }, checkTimer, checkSeq = 0;
const $ = id => document.getElementById(id);
// The kinds of email, grouped under the Class and Notice tabs. color = the dot and the active icon.
const ICON = {
  live: '<path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
  recorded: '<circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z"/>',
  reminder: '<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  test: '<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  resources: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  noclass: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m14 14-4 4"/><path d="m10 14 4 4"/>',
  message: '<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
};
const KIND = {
  live: { tab: 'class', label: 'Live class', color: '#16A34A' },
  recorded: { tab: 'class', label: 'Recording', color: '#B5660A' },
  reminder: { tab: 'class', label: 'Reminder', color: '#16A34A' },
  test: { tab: 'notice', label: 'Mock test', color: '#7C3AED' },
  resources: { tab: 'notice', label: 'Resources', color: '#2563EB' },
  noclass: { tab: 'notice', label: 'No class', color: '#64748B' },
  message: { tab: 'notice', label: 'Message', color: '#0A1226' },
};
const svg = (paths, cls) => '<svg class="ico' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + paths + '</svg>';
const kindDot = k => '<i class="dot" style="background:' + (KIND[k] || KIND.live).color + '"></i>';

const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many || one + 's');
const hoursShort = m => !m ? '0m' : m < 60 ? m + 'm' : Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
// Shrinks any stat figure that still does not fit its column (never below 14px); last resort is its short form.
function fitStats() {
  document.querySelectorAll('.stat .n').forEach(n => {
    n.style.fontSize = '';
    if (n.dataset.full) n.textContent = n.dataset.full;
    let f = parseFloat(getComputedStyle(n).fontSize);
    while (n.scrollWidth > n.clientWidth && f > 14) { f -= 1; n.style.fontSize = f + 'px'; }
    if (n.scrollWidth > n.clientWidth && n.dataset.short) n.textContent = n.dataset.short;
  });
}
addEventListener('resize', fitStats);
const hours = m => !m ? '0 min' : m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
const store = (k, v) => { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const read = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };

function say(text, ok) {
  const inSheet = stack.length > 0;
  const m = $(inSheet ? 'sheetMsg' : 'msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.hidden = false;
  if (inSheet) $('sheetBody').scrollTo({ top: 0, behavior: 'smooth' }); else window.scrollTo({ top: 0, behavior: 'smooth' });
}
function call(fn, args, onOk, btn, onFail) {
  if (btn) { btn.disabled = true; btn.classList.add('busy'); }
  const done = () => { if (btn) { btn.disabled = false; btn.classList.remove('busy'); } };
  google.script.run
    .withSuccessHandler(r => { done(); onOk(r); })
    .withFailureHandler(e => { done(); if (onFail) onFail(e); else say(e.message || String(e), false); })[fn](...args);
}

// ---- day and time pickers (device time = Bangladesh time) ----
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const clock12 = t => { const [h, m] = t.split(':').map(Number); return ((h % 12) || 12) + ':' + pad(m) + (h < 12 ? ' AM' : ' PM'); };
const CAL = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>';
const CLOCK = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';

const addDay = (v, n) => { const [y, m, d] = v.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); };
// A row of day cards (two weeks from `from`, default today) plus Other for the phone's calendar.
function dayCards(id, value, onPick, from) {
  const box = $(id); box.innerHTML = '';
  const today = ymd(new Date()), list = [];
  for (let i = 0; i < 14; i++) list.push(addDay(from || today, i));
  if (value && !list.includes(value)) list.push(value);
  list.forEach(v => {
    const [y, m, d] = v.split('-').map(Number);
    const l = document.createElement('label'); l.className = 'day';
    l.innerHTML = '<input type="radio"><span class="wd"></span><span class="dn"></span><span class="mo"></span>';
    const r = l.querySelector('input'); r.name = id; r.value = v; r.checked = v === value;
    r.setAttribute('aria-label', WD[new Date(y, m - 1, d).getDay()] + ' ' + d + ' ' + MO[m - 1]);
    r.onchange = () => onPick(v);
    l.querySelector('.wd').textContent = v === today ? 'Today' : WD[new Date(y, m - 1, d).getDay()];
    l.querySelector('.dn').textContent = d;
    l.querySelector('.mo').textContent = MO[m - 1];
    box.append(l);
  });
  const other = document.createElement('label'); other.className = 'day other';
  other.innerHTML = CAL + '<span class="mo">Other</span><input type="date" class="native" aria-label="Pick another date">';
  const inp = other.querySelector('input'); inp.min = list[0];
  inp.onchange = () => { if (inp.value) onPick(inp.value); };
  box.append(other);
  const sel = box.querySelector('input[type=radio]:checked');
  if (sel) sel.parentElement.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function renderDays() { dayCards('days', day, v => { day = v; renderDays(); syncWhen(); }); }

// Length chips: classes and tests have different usual lengths. The last one picked is kept.
const LENGTHS = { live: [[60, '1 h'], [90, '1.5 h'], [120, '2 h']], test: [[60, '1 h'], [120, '2 h'], [165, '2 h 45 min']] };
function renderLengths() {
  const set = kind === 'test' ? 'test' : 'live';
  if (lenFor === set) return;
  lenFor = set;
  const keep = read('len:' + set) || String(LENGTHS[set][set === 'test' ? 2 : 0][0]);
  const box = $('lenChips'); box.innerHTML = '';
  LENGTHS[set].forEach(([v, t]) => {
    const l = document.createElement('label'); l.className = 'chip';
    l.innerHTML = '<input type="radio" name="minutes"><span></span>';
    const r = l.querySelector('input'); r.value = v; r.checked = String(v) === keep;
    r.onchange = () => { store('len:' + set, String(v)); syncWhen(); };
    l.querySelector('span').textContent = t;
    box.append(l);
  });
}

// Time is one field in three parts (hour : minutes AM/PM); each part opens the phone's own picker.
function buildClock() {
  for (let h = 1; h <= 12; h++) $('hh').add(new Option(String(h), String(h)));
  for (let m = 0; m < 60; m += 5) $('mm').add(new Option(pad(m), pad(m)));
  setClock(read('lastTime') || '20:00');
  ['hh', 'mm', 'ap'].forEach(id => $(id).addEventListener('change', readClock));
}
function setClock(t) {
  const [h, m] = t.split(':').map(Number);
  $('hh').value = String((h % 12) || 12); $('mm').value = pad(m - (m % 5)); $('ap').value = h < 12 ? 'AM' : 'PM';
  clock = pad(h) + ':' + pad(m - (m % 5));
}
function readClock() {
  const h = (Number($('hh').value) % 12) + ($('ap').value === 'PM' ? 12 : 0);
  clock = pad(h) + ':' + $('mm').value;
  syncWhen();
}

function syncWhen() {
  const start = day && clock ? day + 'T' + clock : '';
  $('start').value = start;
  const sum = $('whenSum');
  sum.hidden = !start;
  if (start) {
    const [h, m] = clock.split(':').map(Number);
    const end = (h * 60 + m + Number(minutes())) % 1440;
    sum.innerHTML = CLOCK + '<span></span>';
    sum.querySelector('span').textContent = whenShort(start).replace(/, (\d+:\d+ [AP]M)$/, ' · $1') + ' to ' + clock12(pad(Math.floor(end / 60)) + ':' + pad(end % 60));
  }
  schedule(0);
}
function resetWhen() {
  store('lastTime', clock);
  day = ymd(new Date());
  renderDays(); setClock(clock); syncWhen();
}

// ---- sheet: a stack of {view, name}; x and Esc go back one step, the dimmed area closes it ----
const sheet = $('sheet');
function showSheet(view, title) {
  $('detail').hidden = view !== 'detail'; $('edit').hidden = view !== 'edit';
  $('sheetTitle').textContent = title; $('sheetMsg').hidden = true; $('sheetBody').scrollTop = 0;
  if (!sheet.open) { sheet.classList.remove('closing'); sheet.showModal(); }
}
function openDetail(name) { stack.push({ view: 'detail', name }); renderDetail(name); }
function openEdit(name) { stack.push({ view: 'edit', name }); renderEdit(name); }
function back() {
  stack.pop();
  const top = stack[stack.length - 1];
  if (!top) return closeSheet();
  if (top.view === 'detail') renderDetail(top.name); else renderEdit(top.name);
}
function closeSheet() {
  stack = [];
  if (!sheet.open) return;
  sheet.classList.add('closing');
  setTimeout(() => { sheet.close(); sheet.classList.remove('closing'); }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 190);
}
sheet.addEventListener('cancel', e => { e.preventDefault(); back(); });
sheet.addEventListener('click', e => {
  if (e.target !== sheet) return;
  const r = sheet.getBoundingClientRect();
  if (e.clientY < r.top || e.clientY > r.bottom || e.clientX < r.left || e.clientX > r.right) closeSheet();
});

// ---- screens ----
// Class and Notice share one screen; each tab remembers the kind used last.
function go(view) {
  const send = view !== 'batches';
  $('send').hidden = !send; $('batches').hidden = send;
  [['navClass', 'class'], ['navNotice', 'notice'], ['navBatches', 'batches']].forEach(([id, v]) => $(id).classList.toggle('on', v === view));
  $('msg').hidden = true;
  if (send) {
    store('tab', view);
    if (KIND[kind].tab !== view) {
      if (!$('readyCard').hidden) hideReady();
      const k = read('kind:' + view);
      setKind(KIND[k] && KIND[k].tab === view ? k : view === 'class' ? 'live' : 'test');
    }
  }
  if (view === 'batches') renderBatchList();
  window.scrollTo(0, 0);
}

// ---- send ----
function current() { return picked; }
function minutes() { const r = document.querySelector('input[name=minutes]:checked'); return r ? r.value : '60'; }
function chosenRec() { const r = document.querySelector('input[name=rec]:checked'); return r && recs ? recs[Number(r.value)] : null; }
// live and recorded can come from Zoom or from a pasted invitation/link; the other kinds have no source.
function source() {
  if (kind !== 'live' && kind !== 'recorded') return '';
  if (!zoomOn || paste[kind] || (kind === 'recorded' && !recsOn)) return 'paste';
  return 'zoom';
}
function testWhere() { const r = document.querySelector('input[name=where]:checked'); return zoomOn && r ? r.value : 'link'; }
function reason() { const r = document.querySelector('input[name=reason]:checked'); return r ? r.value : ''; }
const timed = () => kind === 'test' || (kind === 'live' && source() === 'zoom');
function form() {
  const src = source();
  return {
    batch: current(), type: kind, source: src, tip: $('tip').value,
    title: timed() ? $('zTitle').value : kind === 'resources' ? $('resTitle').value : kind === 'message' ? $('msgTitle').value : $('title').value,
    start: $('start').value, minutes: minutes(), invite: $('invite').value, rec: chosenRec(),
    where: testWhere(), testLink: $('testLink').value,
    classId: remPick,
    files: res.filter(x => x.data).map(x => x.data), links: links.slice(),
    note: kind === 'resources' ? $('resNote').value : $('breakNote').value,
    from: off, back: backDay, reason: reason(),
    message: $('msgText').value,
  };
}

function renderKinds() {
  const box = $('kinds'); box.innerHTML = '';
  Object.keys(KIND).filter(k => KIND[k].tab === KIND[kind].tab).forEach(k => {
    const b = document.createElement('button');
    b.className = k === kind ? 'on' : ''; b.style.setProperty('--k', KIND[k].color);
    b.setAttribute('aria-pressed', k === kind);
    b.innerHTML = svg(ICON[k]) + '<span></span>';
    b.querySelector('span').textContent = KIND[k].label;
    b.onclick = () => { if (k !== kind) { if (!$('readyCard').hidden) hideReady(); setKind(k); } };
    box.append(b);
  });
}
function setKind(k) {
  kind = k; store('kind:' + KIND[k].tab, k);
  titleTouched = false; fillTitle();
  renderKinds(); applyMode();
}
function usePaste(on) { paste[kind] = on; applyMode(); }
function applyMode() {
  const src = source();
  $('liveZoom').hidden = !timed();
  $('recPick').hidden = !(kind === 'recorded' && src === 'zoom');
  $('pasteBox').hidden = src !== 'paste';
  $('backToPick').hidden = !(zoomOn && (kind === 'live' || recsOn));
  $('backToPick').textContent = kind === 'live' ? 'Create the Zoom meeting from here instead' : 'Pick from Zoom recordings instead';
  $('titleWrap').hidden = !(kind === 'recorded' || (kind === 'live' && src === 'paste'));
  $('pasteLabel').textContent = kind === 'live' ? 'Zoom invitation' : 'Recording link';
  $('invite').placeholder = kind === 'live'
    ? 'In Zoom: Meetings › your class › Copy invitation, then paste it here'
    : 'Paste the recording share link (and its passcode, if it has one)';
  $('zTitleLabel').textContent = kind === 'test' ? 'Test title' : 'Class title';
  $('zTitle').placeholder = kind === 'test' ? 'Full mock test 3' : 'Writing Task 2: opinion essays';
  $('pasteLive').hidden = kind !== 'live';
  $('whereRow').hidden = kind !== 'test';
  $('whereZoom').hidden = !zoomOn;
  $('testLink').hidden = testWhere() !== 'link';
  $('remBox').hidden = kind !== 'reminder';
  $('resBox').hidden = kind !== 'resources';
  $('breakBox').hidden = kind !== 'noclass';
  $('msgBox').hidden = kind !== 'message';
  $('tipWrap').hidden = kind === 'message';
  $('zoomNote').hidden = !$('zoomNote').textContent || !['live', 'recorded', 'test'].includes(kind);
  if (timed()) { renderLengths(); syncWhen(); }
  if (kind === 'recorded' && src === 'zoom' && recs === null) loadRecs();
  if (kind === 'reminder') renderRem();
  if (kind === 'noclass') renderBreak();
  schedule(0);
}

// ---- reminder: pick one of the batch's upcoming classes; the email reuses its link ----
function renderRem() {
  const b = batches.find(x => x.name === picked);
  const up = (b && b.upcoming) || [];
  if (!up.some(u => u.id === remPick)) remPick = up[0] ? up[0].id : '';
  const list = $('remList'); list.innerHTML = '';
  if (!up.length) {
    list.innerHTML = '<p class="empty">No upcoming class for this batch. Make the live class first, then remind them here</p>';
    const mk = document.createElement('button'); mk.className = 'link'; mk.textContent = 'Make a live class'; mk.onclick = () => setKind('live');
    list.append(mk);
    return;
  }
  up.forEach(u => {
    const l = document.createElement('label'); l.className = 'rec';
    l.innerHTML = '<input type="radio" name="rem">' + kindDot(u.type) + '<div><b></b><span></span></div>';
    const r = l.querySelector('input'); r.checked = u.id === remPick;
    r.onchange = () => { remPick = u.id; schedule(0); };
    l.querySelector('b').textContent = u.title;
    l.querySelector('span').textContent = whenShort(u.start) + ' · ' + (u.type === 'test' ? 'Mock test' : 'Live class');
    list.append(l);
  });
}

// ---- resources: files upload to Drive as soon as they are picked; links are added as they are ----
const MAX_FILE = 20 * 1024 * 1024;

    const item = { key: Math.random().toString(36).slice(2), name: file.name, size: file.size, status: 'up', data: null };
    res.push(item);
    if (file.size > MAX_FILE) { item.status = 'big'; return; }
    const reader = new FileReader();
    reader.onload = () => upload(item, file.type, String(reader.result).split(',')[1] || '');
    reader.onerror = () => { item.status = 'err'; renderFiles(); };

}
function upload(item, mime, b64) {

  call('uploadResource', [item.name, mime, b64], r => {
    if (!res.includes(item)) return call('removeResource', [r.id], () => {}, null, () => {}); // removed while uploading
    item.data = r; item.status = r.shared ? 'ok' : 'private'; renderFiles(); schedule(0);

}

}

}
const STATUS = {
  up: ['', 'Uploading…'],
  ok: ['good', 'Ready'],
  private: ['warn', 'Ready, but Drive did not allow "anyone with the link". Students may not open it'],
  err: ['bad', 'Upload failed'],

};
function renderFiles() {
  const box = $('fileList'); box.innerHTML = '';

    const el = document.createElement('div'); el.className = 'file' + (up ? ' up' : '');
    el.innerHTML = '<span class="badge"></span><div class="main"><b></b><span class="meta"></span></div><button class="x" aria-label="Remove">' + svg('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>') + '</button>';
    el.querySelector('.badge').textContent = badge;

      lastCheck = r;
      const box = $('check'); box.innerHTML = '';
      const good = document.createElement('div'); good.className = 'good';
      good.textContent = r.emails.length ? plural(r.emails.length, 'email') + ' found' : 'No emails found yet';
      box.append(good);
      if (r.skipped.length) {
        const bad = document.createElement('div'); bad.className = 'bad';
        bad.innerHTML = '<div></div><code></code>';
        bad.firstChild.textContent = plural(r.skipped.length, 'address', 'addresses') + ' could not be read and will be left out. Fix them in the box:';
        bad.lastChild.textContent = r.skipped.join(', ');
        box.append(bad);
      }
    });
  }, 300);
}
function doSave() {
  const name = $('bName').value.trim();
  call('saveBatch', [editingName, name, $('bEmails').value], r => {
    // The box is only cleared after the server confirms the save.
    store('lastBatch', r.name);
    stack = [{ view: 'detail', name: r.name }];
    refresh(() => { renderDetail(r.name); say('Saved ' + r.name + ' with ' + plural(r.count, 'student'), true); });
  }, $('saveBtn'));
}
// Two steps on purpose: the first tap only asks.
function askDelete(on) {
  $('delAsk').hidden = !on; $('delBtn').hidden = on;
  if (!on) return;
  const b = batches.find(x => x.name === editingName);
  $('delQ').textContent = 'Delete ' + editingName + '?' + (b ? ' Its list of ' + plural(b.count, 'student') + ' is removed.' : '') + ' Its class history stays.';
  $('delAsk').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function doDelete() {
  call('deleteBatch', [editingName], () => { closeSheet(); refresh(() => { go('batches'); say('Deleted ' + editingName, true); }); }, $('delYes'));
}

function copyEmails(list) {
  const text = list.join(', ');
  const fallback = () => {
    const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.append(t); t.select(); t.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); t.remove();
    say(ok ? plural(list.length, 'email') + ' copied, separated by commas' : 'Copy did not work here. Open Edit emails and copy from the box', ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => say(plural(list.length, 'email') + ' copied, separated by commas', true), fallback);
  } else fallback();
}

// ---- load ----
let first = true;
function refresh(then) {
  call('pageData', [], r => {
    batches = r.batches;
    const z = r.zoom || {};
    zoomOn = Boolean(z.connected && z.create); recsOn = Boolean(z.connected && z.recordings);
    showZoomNote(z);
    fillTitle();
    renderChips();
    if (first) {
      first = false;
      const t = read('tab') === 'notice' ? 'notice' : 'class', k = read('kind:' + t);
      setKind(KIND[k] && KIND[k].tab === t ? k : t === 'class' ? 'live' : 'test');
      go(t);
      if (!batches.length) openEdit('');
    } else applyMode();
    if (!$('batches').hidden) renderBatchList();
    if (then) then();
  });
}
// Touching the form after a draft was made starts the next class email.
['input', 'change'].forEach(ev => $('send').addEventListener(ev, e => { if (!$('readyCard').hidden && !$('readyCard').contains(e.target)) hideReady(); }, true));
$('invite').addEventListener('input', () => schedule(500));
['zTitle', 'title', 'tip', 'resTitle', 'resNote', 'breakNote', 'msgTitle', 'msgText', 'testLink'].forEach(id => $(id).addEventListener('input', () => schedule(600)));
document.querySelectorAll('input[name=where]').forEach(r => r.addEventListener('change', () => { $('testLink').hidden = testWhere() !== 'link'; schedule(0); }));
day = ymd(new Date()); renderDays(); buildClock(); syncWhen();
$('bEmails').addEventListener('input', runCheck);
$('batchSearch').addEventListener('input', () => renderChips());
$('listSearch').addEventListener('input', renderBatchList);
refresh();
</script>
